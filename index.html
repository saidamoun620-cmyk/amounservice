<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMOUN SERVICE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:#fff;font-family:sans-serif}.top{position:sticky;top:0;z-index:10;background:#050505;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1a1a1a}.logo{width:40px;height:40px;border:1px solid #c9a86a;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#c9a86a;font-weight:700}.cart{position:relative;width:44px;height:44px;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}.cart b{position:absolute;top:-6px;right:-6px;background:#e8c87a;color:#000;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}.hero{text-align:center;padding:30px 16px}.hero h1{color:#e8c87a;font-size:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 100px}.card{background:#101010;border:1px solid #1c1c1c;border-radius:20px;overflow:hidden}.img{aspect-ratio:1;background:radial-gradient(circle at 50% 50%,#1a1a1a,#080808);display:flex;align-items:center;justify-content:center;font-size:56px}.body{padding:10px}.price{color:#e8c87a;font-weight:900;margin:8px 0;font-size:16px}.add{width:100%;background:#e8c87a;border:0;border-radius:20px;padding:10px;font-weight:800}.wa{width:100%;margin-top:6px;background:#1fdb6b;color:#fff;border:0;border-radius:20px;padding:10px;font-weight:800}#cartBox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99;display:none;padding:20px}#cartBox.show{display:block}.box{background:#111;border:1px solid #222;border-radius:20px;padding:20px;max-width:400px;margin:40px auto}</style></head><body><div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">AS</div><b style="color:#c9a86a">AMOUN SERVICE</b></div><div class="cart" onclick="openCart()">👜<b id="cnt">0</b></div></div><div class="hero"><h1>L'excellence,<br>toujours connectée.</h1><p style="color:#777;margin-top:10px;font-size:13px">Livraison 24h à Moroni</p></div><div class="grid" id="grid"></div><div id="cartBox"><div class="box"><h2 style="color:#e8c87a">Votre Panier 👜</h2><div id="list" style="margin:20px 0;color:#ccc"></div><div id="tot" style="color:#e8c87a;font-weight:900;font-size:22px"></div><button onclick="orderWA()" style="width:100%;margin-top:15px;background:#1fdb6b;color:#fff;border:0;border-radius:22px;padding:14px;font-weight:800">Commander sur WhatsApp</button><button onclick="closeCart()" style="width:100%;margin-top:10px;background:#222;color:#fff;border:1px solid #333;border-radius:20px;padding:10px">Fermer</button></div></div><script>const WA='2694273776';let C=[];const P=[{n:'Chargeur Sans Fil 15W',p:3000,e:'🔌'},{n:'Cable Type-C vers iPhone 7,X,11,12,13,14',p:3500,e:'🍎'},{n:'Chargeur Sans Fil Noir',p:7500,e:'⚫'},{n:'Ecouteurs avec Fil',p:4000,e:'🎧'},{n:'Cable Type-C 2M',p:2500,e:'🔗'},{n:'Support Telephone',p:5000,e:'📱'}];const g=document.getElementById('grid');P.forEach((x,i)=>{g.innerHTML+=`<div class=card><div class=img>${x.e}</div><div class=body><h3 style=font-size:12px>${x.n}</h3><div class=price>${x.p} KMF</div><button class=add onclick="add(${i})">+ Ajouter</button><button class=wa onclick="add(${i});openCart()">WhatsApp</button></div></div>`});function add(i){C.push(P[i]);document.getElementById('cnt').innerText=C.length;alert(P[i].n+' ajouté !')}function openCart(){let h='',t=0;C.forEach(c=>{h+=`<div style=display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222><span>${c.n}</span><b>${c.p} KMF</b></div>`;t+=c.p});document.getElementById('list').innerHTML=h||'Panier vide';document.getElementById('tot').innerHTML=t?'Total: '+t+' KMF':'';document.getElementById('cartBox').classList.add('show')}function closeCart(){document.getElementById('cartBox').classList.remove('show')}function orderWA(){if(!C.length)return alert('Panier vide');let m='Salut AMOUN SERVICE! Je veux commander:%0A',tt=0;C.forEach(c=>{m+=`- ${c.n} (${c.p} KMF)%0A`;tt+=c.p});m+=`%0ATotal: ${tt} KMF`;window.open(`https://wa.me/${WA}?text=${m}`,'_blank')}</script></body></html>
